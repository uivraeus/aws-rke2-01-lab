# Shared config ConfigMap for the Roles Anywhere Kyverno policies
# (rolesanywhere/manifests/infra/kyverno-rolesanywhere-*.yaml) and the vault-aws-credential-helper
# Kyverno policy (vault/manifests/infra/kyverno-vault-cred-helper-mutation.yaml). Holds only
# cluster-wide singletons (one trust anchor/profile/Vault instance per cluster) - the
# per-workload IAM role ARN varies per ServiceAccount instead and travels via the
# rke2-lab.internal/rolesanywhere-role-arn annotation. Bridged in via envsubst from
# `terraform output` since CEL has no notion of a Terraform output directly.
#
# Apply once, before rolesanywhere/manifests/infra/kyverno-rolesanywhere-policies.yaml,
# rolesanywhere/manifests/infra/kyverno-rolesanywhere-mutation.yaml, and
# vault/manifests/infra/kyverno-vault-cred-helper-mutation.yaml (all read this):
#
#   export CLUSTER_NAME=$(terraform -chdir=terraform output -raw cluster_name)
#   export ROLESANYWHERE_TRUST_ANCHOR_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_trust_anchor_arn)
#   export ROLESANYWHERE_PROFILE_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_profile_arn)
#   export AWS_REGION=$(terraform -chdir=terraform output -raw aws_region)
#   export VAULT_ADDR="http://$(terraform -chdir=terraform output -raw vault_private_ip):8200"
#   envsubst '${CLUSTER_NAME} ${ROLESANYWHERE_TRUST_ANCHOR_ARN} ${ROLESANYWHERE_PROFILE_ARN} ${AWS_REGION} ${VAULT_ADDR}' \
#     < shared/manifests/kyverno-config.yaml | kubectl --kubeconfig kubeconfig apply -f -

apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: kyverno
data:
  clusterName: ${CLUSTER_NAME}
  rolesanywhereTrustAnchorArn: ${ROLESANYWHERE_TRUST_ANCHOR_ARN}
  rolesanywhereProfileArn: ${ROLESANYWHERE_PROFILE_ARN}
  awsRegion: ${AWS_REGION}
  vaultAddress: ${VAULT_ADDR}
