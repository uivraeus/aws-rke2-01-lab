---
# Standalone playbook (not part of site.yml/make bootstrap-k8s) that performs RKE2's
# documented service-account signing key rotation procedure
# (https://docs.rke2.io/security/certificates) and verifies the outcome against what
# the docs claim:
#   - the old key stays valid for verifying already-issued tokens
#   - a freshly-issued token gets signed with the new key
#
# Not part of the IRSA solution itself, but exercises exactly the "signing key
# rotation" scenario `make sync-oidc` exists to recover from (see README.md,
# ansible-notes.md). If this cluster is wired up for IRSA, follow up with
# `make sync-oidc` afterwards - this playbook only rotates the live cluster's key, it
# does not touch the mirrored copy in S3.
#
# Run with: make rotate-sa-key  (or `ansible-playbook rotate_service_account_key.yml`)

- name: Rotate the RKE2 service-account signing key and verify the documented behavior
  hosts: control
  gather_facts: false
  vars:
    staging_dir: /opt/rke2/server

  tasks:
    - name: Fetch the live JWKS before rotation
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - --raw
          - /openid/v1/jwks
      register: jwks_before
      changed_when: false

    - name: Issue a fresh token and capture its signing kid, before rotation
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=$PATH:/var/lib/rancher/rke2/bin
        TOKEN=$(kubectl create token default -n default --duration=10m)
        python3 -c "
        import sys, json, base64
        h = sys.argv[1].split('.')[0]
        h += '=' * (-len(h) % 4)
        print(json.dumps(json.loads(base64.urlsafe_b64decode(h))))
        " "$TOKEN"
      args:
        executable: /bin/bash
      register: token_header_before
      changed_when: false

    - name: Reset the staging directory (idempotent - safe to re-run this playbook)
      ansible.builtin.file:
        path: "{{ staging_dir }}/tls"
        state: "{{ item }}"
        mode: "0700"
      loop:
        - absent
        - directory

    - name: Generate a new service-account signing key in the staging directory
      ansible.builtin.shell: |
        set -euo pipefail
        FLAGS=""
        openssl version | grep -qF 'OpenSSL 3' && FLAGS="-traditional"
        openssl genrsa $FLAGS -out {{ staging_dir }}/tls/service.key 2048
      args:
        executable: /bin/bash

    - name: Append the current (pre-rotation) key so already-issued tokens stay valid
      ansible.builtin.shell: |
        set -euo pipefail
        cat /var/lib/rancher/rke2/server/tls/service.key >> {{ staging_dir }}/tls/service.key
      args:
        executable: /bin/bash

    - name: Rotate the service-account signing key via rke2 certificate rotate-ca
      ansible.builtin.command:
        argv:
          - /usr/local/bin/rke2
          - certificate
          - rotate-ca
          - "--path={{ staging_dir }}"
      register: rotate_ca_result

    - name: Restart rke2-server to load the rotated key
      ansible.builtin.systemd:
        name: rke2-server
        state: restarted

    - name: Wait for the Kubernetes API to accept connections again
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 120

    - name: Wait for all nodes to report Ready
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - wait
          - nodes
          - --all
          - --for=condition=Ready
          - --timeout=120s
      changed_when: false

    - name: Fetch the live JWKS after rotation
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - --raw
          - /openid/v1/jwks
      register: jwks_after
      changed_when: false

    - name: Issue a fresh token and capture its signing kid, after rotation
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=$PATH:/var/lib/rancher/rke2/bin
        TOKEN=$(kubectl create token default -n default --duration=10m)
        python3 -c "
        import sys, json, base64
        h = sys.argv[1].split('.')[0]
        h += '=' * (-len(h) % 4)
        print(json.dumps(json.loads(base64.urlsafe_b64decode(h))))
        " "$TOKEN"
      args:
        executable: /bin/bash
      register: token_header_after
      changed_when: false

    - name: Extract kid lists from before/after JWKS and signing tokens
      ansible.builtin.set_fact:
        kids_before: "{{ (jwks_before.stdout | from_json)['keys'] | map(attribute='kid') | list }}"
        kids_after: "{{ (jwks_after.stdout | from_json)['keys'] | map(attribute='kid') | list }}"
        signing_kid_before: "{{ (token_header_before.stdout | from_json).kid }}"
        signing_kid_after: "{{ (token_header_after.stdout | from_json).kid }}"

    - name: Report rotation outcome
      ansible.builtin.debug:
        msg:
          - "JWKS kids before rotation: {{ kids_before }}"
          - "JWKS kids after rotation:  {{ kids_after }}"
          - "Freshly-issued token kid before: {{ signing_kid_before }}"
          - "Freshly-issued token kid after:  {{ signing_kid_after }}"

    - name: Assert the docs' claims hold - old key retained, new key used for new tokens
      ansible.builtin.assert:
        that:
          - signing_kid_before in kids_after
          - signing_kid_after != signing_kid_before
          - signing_kid_after in kids_after
        fail_msg: "RKE2 did not behave as documented - see the kid lists in the previous task's output."
        success_msg: >-
          Confirmed: the pre-rotation signing key is still present in the JWKS (old
          tokens stay valid), and a freshly-issued token is now signed with a
          different, new key - matches RKE2's documented rotate-ca behavior.

    - name: Remind to re-sync the OIDC mirror if this cluster is used for IRSA
      ansible.builtin.debug:
        msg: >-
          The live JWKS changed. If this cluster is wired up for IRSA, run
          `make sync-oidc` now to refresh the mirrored copy in S3.
