---
# Session Manager always executes as the auto-provisioned "ssm-user" account (with NOPASSWD
# sudo), regardless of the AMI's default login user — there's no SSM login-as-user without
# extra RunAs configuration, so this must match ssm-user, not "ubuntu".
ansible_user: ssm-user
ansible_become: true

# aws_region / aws_profile / ssm_bucket_name / control_private_ip come from
# group_vars/all/terraform.yml, which is generated by `terraform apply` — do not edit by hand.
ansible_aws_ssm_bucket_name: "{{ ssm_bucket_name }}"
ansible_aws_ssm_region: "{{ aws_region }}"
ansible_aws_ssm_profile: "{{ aws_profile }}"

rke2_channel: stable
rke2_supervisor_port: 9345

kubeconfig_local_path: "{{ playbook_dir }}/../kubeconfig"
