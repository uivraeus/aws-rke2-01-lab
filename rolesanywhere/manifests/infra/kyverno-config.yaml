# Cluster-wide config ConfigMap for the Roles Anywhere Kyverno policies
# (rolesanywhere/manifests/infra/kyverno-rolesanywhere-*.yaml) - holds the cluster-wide
# singletons (one trust anchor/profile per cluster) they need; the per-workload IAM role
# ARN varies per ServiceAccount instead and travels via the
# rke2-lab.internal/rolesanywhere-role-arn annotation. Bridged in via envsubst from
# `terraform output` since CEL has no notion of a Terraform output directly.
#
# Same ConfigMap name/namespace (kyverno/cluster-config) as
# vault/manifests/infra/kyverno-config.yaml - each track owns its own copy, not meant to
# coexist with the other; whichever is applied last wins if both tracks are ever installed
# on the same cluster at once.
#
# Apply once, before rolesanywhere/manifests/infra/kyverno-rolesanywhere-policies.yaml and
# rolesanywhere/manifests/infra/kyverno-rolesanywhere-mutation.yaml (both read this):
#
#   export CLUSTER_NAME=$(terraform -chdir=terraform output -raw cluster_name)
#   export ROLESANYWHERE_TRUST_ANCHOR_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_trust_anchor_arn)
#   export ROLESANYWHERE_PROFILE_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_profile_arn)
#   export AWS_REGION=$(terraform -chdir=terraform output -raw aws_region)
#   envsubst '${CLUSTER_NAME} ${ROLESANYWHERE_TRUST_ANCHOR_ARN} ${ROLESANYWHERE_PROFILE_ARN} ${AWS_REGION}' \
#     < rolesanywhere/manifests/infra/kyverno-config.yaml | kubectl --kubeconfig kubeconfig apply -f -

apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: kyverno
data:
  clusterName: ${CLUSTER_NAME}
  rolesanywhereTrustAnchorArn: ${ROLESANYWHERE_TRUST_ANCHOR_ARN}
  rolesanywhereProfileArn: ${ROLESANYWHERE_PROFILE_ARN}
  awsRegion: ${AWS_REGION}
