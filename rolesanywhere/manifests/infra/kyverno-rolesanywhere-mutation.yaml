# Kyverno MutatingPolicy that automates the Roles Anywhere pod-level wiring
# (fetch-signing-helper initContainer, signing-helper/aws-config volumes, the
# rolesanywhere-tls Secret mount, AWS_CONFIG_FILE/AWS_REGION) that
# rolesanywhere/manifests/validation/rolesanywhere-test.yaml still hand-writes - the same
# role amazon-eks-pod-identity-webhook plays for IRSA. See rolesanywhere/docs/design.md's
# "Pod-level wiring" section for the full write-up, including why this needs its own
# rke2-lab.internal/rolesanywhere-role-arn annotation rather than reusing IRSA's role-arn key.
#
# Apply once, after rolesanywhere/manifests/infra/kyverno-config.yaml (this reads that ConfigMap) and
# rolesanywhere/manifests/infra/kyverno-rolesanywhere-policies.yaml (the Certificate this mounts comes from
# that policy's GeneratingPolicy):
#
#   kubectl --kubeconfig kubeconfig apply -f rolesanywhere/manifests/infra/kyverno-rolesanywhere-mutation.yaml

apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: rolesanywhere-mutate-pod
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE']
        resources: ['pods']
  variables:
    - name: saName
      expression: 'object.spec.?serviceAccountName.orValue("default")'
    - name: serviceAccount
      expression: 'resource.Get("v1", "serviceaccounts", object.metadata.namespace, variables.saName)'
    - name: saAnnotations
      expression: 'variables.serviceAccount.metadata.?annotations.orValue({})'
    # Same map-index gotcha as the GeneratingPolicy's matchConditions (see
    # kyverno-rolesanywhere-policies.yaml's comment on it) - guard with `in` before
    # indexing, don't rely on a bare has()/orValue() alone to make a missing key safe.
    - name: shouldMutate
      expression: >-
        ('rke2-lab.internal/rolesanywhere-enabled' in variables.saAnnotations) &&
        variables.saAnnotations['rke2-lab.internal/rolesanywhere-enabled'] == 'true' &&
        ('rke2-lab.internal/rolesanywhere-role-arn' in variables.saAnnotations)
    - name: roleArn
      expression: >-
        ('rke2-lab.internal/rolesanywhere-role-arn' in variables.saAnnotations) ?
        variables.saAnnotations['rke2-lab.internal/rolesanywhere-role-arn'] : ''
    - name: clusterConfig
      expression: 'resource.Get("v1", "configmaps", "kyverno", "cluster-config").data'
    - name: trustAnchorArn
      expression: 'variables.clusterConfig.rolesanywhereTrustAnchorArn'
    - name: profileArn
      expression: 'variables.clusterConfig.rolesanywhereProfileArn'
    - name: awsRegion
      expression: 'variables.clusterConfig.awsRegion'
    - name: secretName
      expression: 'variables.saName + "-tls"'
    - name: initScript
      expression: >-
        "set -eu\n" +
        "curl -fsSL https://rolesanywhere.amazonaws.com/releases/1.8.5/X86_64/Linux/Amzn2023/aws_signing_helper -o /opt/bin/aws_signing_helper\n" +
        "chmod +x /opt/bin/aws_signing_helper\n" +
        "mkdir -p /opt/aws\n" +
        "cat > /opt/aws/config <<EOF\n" +
        "[default]\n" +
        "credential_process = /opt/bin/aws_signing_helper credential-process --certificate /rolesanywhere/tls.crt --private-key /rolesanywhere/tls.key --trust-anchor-arn " + variables.trustAnchorArn + " --profile-arn " + variables.profileArn + " --role-arn " + variables.roleArn + " --region " + variables.awsRegion + "\n" +
        "region = " + variables.awsRegion + "\n" +
        "EOF\n"
  mutations:
    # JSONPatch throughout, not ApplyConfiguration: a container's `command` ([]string) is
    # an "atomic" field ApplyConfiguration cannot touch at all (a Kubernetes API
    # restriction, not a Kyverno bug - rejected with "may not mutate atomic arrays, maps
    # or structs"). JSONPatch's `value` is plain JSON with no such restriction.
    #
    # volumeMounts/env are patched per-container, per-field, addressed by
    # `object.spec.containers.indexOf(c)`, rather than reconstructing the container object -
    # CEL has no map-merge operator (`+` only works on numbers/strings/bytes/lists, never
    # two maps), so rebuilding a container from scratch would silently drop every field not
    # explicitly restated (image, command, ports, resources, ...). Patching only the
    # volumeMounts/env list paths leaves everything else on the container untouched.
    #
    # dyn(...) wraps every individual value inside each heterogeneous map/list literal
    # below - CEL map/list literals are statically homogeneous (one type for every value,
    # unlike JSON) and infer that type from the literal's own contents before an outer
    # dyn() ever applies, so wrapping only the whole literal doesn't help.
    #
    # See rolesanywhere/docs/worklog.md's 2026-08-31 entry for how these three were found.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          !variables.shouldMutate ? [] :
          [
            JSONPatch{
              op: "add",
              path: "/spec/initContainers",
              value: [
                {
                  "name": dyn("fetch-signing-helper"),
                  "image": dyn("curlimages/curl:8.11.1"),
                  "command": dyn(["sh", "-c", variables.initScript]),
                  "volumeMounts": dyn([
                    {"name": dyn("signing-helper"), "mountPath": dyn("/opt/bin")},
                    {"name": dyn("aws-config"), "mountPath": dyn("/opt/aws")}
                  ])
                }
              ] + object.spec.?initContainers.orValue([])
            },
            JSONPatch{
              op: "add",
              path: "/spec/volumes",
              value: object.spec.?volumes.orValue([]) + [
                {"name": dyn("signing-helper"), "emptyDir": dyn({})},
                {"name": dyn("aws-config"), "emptyDir": dyn({})},
                {"name": dyn("rolesanywhere-tls"), "secret": dyn({"secretName": variables.secretName})}
              ]
            }
          ] + object.spec.containers.map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/volumeMounts",
              value: dyn(c.?volumeMounts.orValue([])) + [
                {"name": dyn("signing-helper"), "mountPath": dyn("/opt/bin"), "readOnly": dyn(true)},
                {"name": dyn("aws-config"), "mountPath": dyn("/opt/aws"), "readOnly": dyn(true)},
                {"name": dyn("rolesanywhere-tls"), "mountPath": dyn("/rolesanywhere"), "readOnly": dyn(true)}
              ]
            }
          ) + object.spec.containers.map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/env",
              value: dyn(c.?env.orValue([])) + [
                {"name": dyn("AWS_CONFIG_FILE"), "value": dyn("/opt/aws/config")},
                {"name": dyn("AWS_REGION"), "value": dyn(variables.awsRegion)}
              ]
            }
          )
