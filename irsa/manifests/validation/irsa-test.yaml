# Manual IRSA verification - no pod-identity webhook involved. Does by hand what the
# webhook would inject automatically (projected token volume, AWS_ROLE_ARN/
# AWS_WEB_IDENTITY_TOKEN_FILE) - see irsa/docs/design.md's "Manual verification" section.
#
# Mutually exclusive with irsa/manifests/validation/irsa-webhook-test.yaml - both create
# identically-named objects, so apply only one at a time; delete
# `kubectl delete namespace irsa-test` first to switch.
#
# Fill in the placeholders below from Terraform, then apply against the
# cluster (open `make tunnel-k8s` in another shell first):
#
#   export IRSA_ROLE_ARN=$(terraform -chdir=terraform output -raw irsa_role_arn)
#   export TEST_BUCKET_NAME=$(terraform -chdir=terraform output -raw irsa_test_bucket_name)
#   export AWS_REGION=$(terraform -chdir=terraform output -raw aws_region)
#   envsubst < irsa/manifests/validation/irsa-test.yaml | kubectl --kubeconfig kubeconfig apply -f -
#
# irsa-test namespace/serviceaccount names below must match var.irsa_namespace
# / var.irsa_service_account_name (defaults: "irsa-test" / "irsa-test") -
# they're baked into the IAM role's trust policy condition.

apiVersion: v1
kind: Namespace
metadata:
  name: irsa-test

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: irsa-test
  namespace: irsa-test
  # No rke2-lab.internal/role-arn annotation here - this ServiceAccount is only
  # ever read by this file's own hand-wired Pod below, never by the webhook (see
  # irsa/manifests/validation/irsa-webhook-test.yaml for that annotation instead).

---
apiVersion: v1
kind: Pod
metadata:
  name: irsa-test
  namespace: irsa-test
spec:
  serviceAccountName: irsa-test
  containers:
    - name: aws-cli
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sleep", "infinity"]
      env:
        - name: AWS_ROLE_ARN
          value: ${IRSA_ROLE_ARN}
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
        - name: AWS_REGION
          value: ${AWS_REGION}
        - name: TEST_BUCKET_NAME
          value: ${TEST_BUCKET_NAME}
      volumeMounts:
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
  volumes:
    - name: aws-iam-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: sts.amazonaws.com
              expirationSeconds: 3600
