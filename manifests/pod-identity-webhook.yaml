# aws/amazon-eks-pod-identity-webhook - https://github.com/aws/amazon-eks-pod-identity-webhook
# Installed from its own upstream deploy/*.yaml manifests (adapted below, from
# https://github.com/aws/amazon-eks-pod-identity-webhook/tree/master/deploy),
# since the project ships no Helm chart of its own and isn't in aws/eks-charts
# (https://github.com/aws/eks-charts) either.
#
# cert-manager is a hard prerequisite here, not an option: since v0.3.0 the webhook
# dropped its old self-provisioned-CSR TLS path (--in-cluster=true), so its serving
# cert now has to come from somewhere else - the ClusterIssuer/Certificate below,
# with the MutatingWebhookConfiguration's cert-manager.io/inject-ca-from annotation
# keeping its caBundle in sync. Install with `make cert-manager` first (or
# `make pod-identity-webhook`, which depends on it).
#
# Two deliberate deviations from upstream's example manifests:
#   - Everything lives in its own `pod-identity-webhook` namespace instead of
#     upstream's `default`.
#   - --annotation-prefix is set to `rke2-lab.internal` instead of the EKS default
#     `eks.amazonaws.com` - this cluster isn't EKS, and the flag exists precisely so
#     self-hosted clusters aren't stuck with EKS-branded annotations.
#     --token-mount-path moves in lockstep for the same reason (cosmetic only - the
#     AWS SDK just reads AWS_WEB_IDENTITY_TOKEN_FILE, which the webhook itself points
#     at whatever path this is set to).
#
# See manifests/irsa-test.yaml (the ServiceAccount this webhook now actually acts on)
# and manifests/irsa-webhook-test.yaml (the pod proving it).

apiVersion: v1
kind: Namespace
metadata:
  name: pod-identity-webhook

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["pod-identity-webhook"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-identity-webhook
subjects:
  - kind: ServiceAccount
    name: pod-identity-webhook
    namespace: pod-identity-webhook

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-identity-webhook
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "watch", "list"]
  # Vestigial: only used by the deprecated --in-cluster=true CSR-based cert path,
  # which this deployment doesn't use (--in-cluster=false, cert-manager instead).
  # Kept to match upstream's own auth.yaml rather than trimmed.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["create", "get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-identity-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-identity-webhook
subjects:
  - kind: ServiceAccount
    name: pod-identity-webhook
    namespace: pod-identity-webhook

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
spec:
  secretName: pod-identity-webhook-cert
  commonName: "pod-identity-webhook.pod-identity-webhook.svc"
  dnsNames:
    - "pod-identity-webhook"
    - "pod-identity-webhook.pod-identity-webhook"
    - "pod-identity-webhook.pod-identity-webhook.svc"
    - "pod-identity-webhook.pod-identity-webhook.svc.local"
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-identity-webhook
  template:
    metadata:
      labels:
        app: pod-identity-webhook
    spec:
      serviceAccountName: pod-identity-webhook
      containers:
        - name: pod-identity-webhook
          image: public.ecr.aws/eks/amazon-eks-pod-identity-webhook:v0.6.17
          imagePullPolicy: IfNotPresent
          command:
            - /webhook
            - --in-cluster=false
            - --namespace=pod-identity-webhook
            - --service-name=pod-identity-webhook
            - --annotation-prefix=rke2-lab.internal
            - --token-audience=sts.amazonaws.com
            - --token-mount-path=/var/run/secrets/rke2-lab.internal/serviceaccount
            - --logtostderr
          volumeMounts:
            - name: cert
              mountPath: "/etc/webhook/certs"
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: pod-identity-webhook-cert

---
apiVersion: v1
kind: Service
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
  annotations:
    prometheus.io/port: "443"
    prometheus.io/scheme: "https"
    prometheus.io/scrape: "true"
spec:
  ports:
    - port: 443
      targetPort: 443
  selector:
    app: pod-identity-webhook

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-identity-webhook
  annotations:
    cert-manager.io/inject-ca-from: pod-identity-webhook/pod-identity-webhook
webhooks:
  - name: pod-identity-webhook.amazonaws.com
    failurePolicy: Ignore
    clientConfig:
      service:
        name: pod-identity-webhook
        namespace: pod-identity-webhook
        path: "/mutate"
    objectSelector:
      matchExpressions:
        - key: rke2-lab.internal/skip-pod-identity-webhook
          operator: "DoesNotExist"
          values: []
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    sideEffects: None
    admissionReviewVersions: ["v1beta1"]
