# Kyverno automation + misconfiguration guard for the Roles Anywhere path - see
# docs/rolesanywhere.md's Kyverno section for the full write-up. Two independent policies:
#
# - GeneratingPolicy: watches ServiceAccounts for an opt-in annotation
#   (rke2-lab.internal/rolesanywhere-enabled: "true" - reusing this repo's existing custom
#   annotation prefix from the IRSA pod-identity-webhook, see docs/irsa.md) and generates a
#   cert-manager Certificate for it automatically, deriving the workload-id:// URI from the
#   ServiceAccount's own namespace/name - the same value a human would otherwise have to
#   type by hand in two places (the Certificate and the matching IAM trust policy condition
#   in terraform/rolesanywhere.tf) without any guarantee they stay in sync.
# - ValidatingPolicy: rejects any Certificate that targets the rolesanywhere-ca ClusterIssuer
#   but whose spec.uris doesn't match its own namespace - a guard against an accidentally
#   mistyped or copy-pasted hand-written Certificate, not a defense against a deliberate,
#   already-RBAC-authorized attempt to bypass it (that operator could just edit or delete
#   this policy). Deliberately scoped to only Certificates using rolesanywhere-ca, so it
#   can't interfere with pod-identity-webhook's own, unrelated self-signed cert-manager
#   Certificate.
#
# Both use the current, stable CEL-based GeneratingPolicy/ValidatingPolicy CRDs
# (policies.kyverno.io/v1), not the older ClusterPolicy generate/validate rule style -
# ClusterPolicy was deprecated in Kyverno 1.17 (Feb 2026) with removal planned for 1.20
# (Oct 2026).
#
# Confirmed live end to end (2026-08-30, rke2-lab in eu-north-1): the resource.Get(...)
# ConfigMap lookup and the generate template's (( ... )) interpolation syntax both worked
# exactly as drafted. Two real bugs did surface, both fixed below and explained inline where
# fixed: a CEL map-key-lookup gotcha in the GeneratingPolicy's matchConditions, and a missing
# RBAC grant for Kyverno's background-controller. See docs/rolesanywhere.md's Kyverno section
# for the full writeup, including a pod/Certificate application-order gotcha this surfaced
# that isn't a bug in this file (a Pod applied before its Certificate/Secret exists gets
# stuck retrying a volume mount and needs a delete+recreate, not a self-heal).
#
# Apply once, after manifests/kyverno-config.yaml (this reads that ConfigMap):
#
#   kubectl --kubeconfig kubeconfig apply -f manifests/kyverno-rolesanywhere-policies.yaml

---
# Kyverno's background-controller (which runs `generate` rules) has no built-in permission
# to create arbitrary CRD-backed resources like cert-manager's Certificate - confirmed live,
# the GeneratingPolicy below reported `status.ready: true` (it compiled fine) but every
# actual generation attempt failed with `certificates.cert-manager.io is forbidden: User
# "system:serviceaccount:kyverno:kyverno-background-controller" cannot create resource
# "certificates"...`. Kyverno's own background-controller ClusterRole is empty by design and
# aggregates in anything labeled rbac.kyverno.io/aggregate-to-background-controller: "true"
# (see `kubectl get clusterrole kyverno:background-controller -o yaml` - it's an
# aggregationRule, no ClusterRoleBinding to edit) - this is exactly that extension point,
# not a workaround bolted on separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-generate-rolesanywhere-certificates
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: rolesanywhere-generate-certificate
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['serviceaccounts']
  matchConditions:
    # CEL's map index operator (annotations['key']) throws "no such key" rather than
    # returning false/null when the key is absent - confirmed live: this matchCondition
    # errored on every ServiceAccount that simply doesn't have this annotation at all
    # (cert-manager's own SAs, kube-system's, etc.), not just skip them. has() only
    # confirms the annotations map itself exists, not that this specific key is in it - the
    # `in` operator is what actually guards a map-index lookup.
    - name: opted-in
      expression: >-
        has(object.metadata.annotations) &&
        ('rke2-lab.internal/rolesanywhere-enabled' in object.metadata.annotations) &&
        object.metadata.annotations['rke2-lab.internal/rolesanywhere-enabled'] == 'true'
  variables:
    - name: saNamespace
      expression: 'object.metadata.namespace'
    - name: saName
      expression: 'object.metadata.name'
    - name: clusterName
      expression: 'resource.Get("v1", "configmaps", "kyverno", "cluster-config").data.clusterName'
    - name: workloadUri
      expression: >-
        "workload-id://" + variables.clusterName + ".internal/ns/" + variables.saNamespace + "/sa/" + variables.saName
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: (( variables.saName ))
            namespace: (( variables.saNamespace ))
          spec:
            secretName: (( variables.saName ))-tls
            duration: 1h
            renewBefore: 55m
            usages:
              - digital signature
              - key encipherment
              - client auth
            # Non-empty Subject required by Roles Anywhere (see docs/rolesanywhere.md) -
            # not part of the identity anything actually authorizes on, that's the URI below.
            commonName: (( variables.saName ))
            issuerRef:
              name: rolesanywhere-ca
              kind: ClusterIssuer
            uris:
              - (( variables.workloadUri ))

---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: rolesanywhere-certificate-namespace-guard
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ['cert-manager.io']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['certificates']
  matchConditions:
    - name: targets-rolesanywhere-ca
      expression: >-
        has(object.spec.issuerRef) &&
        object.spec.issuerRef.name == 'rolesanywhere-ca' &&
        object.spec.issuerRef.kind == 'ClusterIssuer'
  validations:
    - expression: >-
        has(object.spec.uris) && size(object.spec.uris) > 0 &&
        object.spec.uris[0].contains('/ns/' + object.metadata.namespace + '/')
      message: >-
        This Certificate's spec.uris must contain "/ns/<this Certificate's own
        namespace>/" - it looks like it's requesting a workload-id:// identity for a
        different namespace than the one it's actually being created in.
