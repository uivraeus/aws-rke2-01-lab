# Roles Anywhere verification.
#
# Real X.509 identity comes from cert-manager (see rolesanywhere-ca-issuer.yaml, applied
# first) - an initContainer feeds the resulting cert/key to AWS's own aws_signing_helper
# binary (fetched at pod start - no official image ships it) as a credential_process.
# Unlike the manual IRSA/Vault verification manifests, this one isn't standing in for a
# webhook/injector that doesn't exist yet - aws_signing_helper actually *is* the intended
# way any non-EC2 workload consumes Roles Anywhere.
#
# The Certificate itself is no longer hand-written here - the ServiceAccount's
# rke2-lab.internal/rolesanywhere-enabled annotation below triggers
# manifests/kyverno-rolesanywhere-policies.yaml's GeneratingPolicy to create one
# automatically, deriving the workload-id:// URI from this ServiceAccount's own
# namespace/name. Apply kyverno-config.yaml and kyverno-rolesanywhere-policies.yaml first
# (see docs/rolesanywhere.md's Kyverno section) or the Certificate never appears and the
# Pod below sits waiting on a Secret that doesn't exist.
#
# rolesanywhere-test namespace/serviceaccount names below must match
# var.rolesanywhere_namespace/var.rolesanywhere_service_account_name (defaults:
# "rolesanywhere-test"/"rolesanywhere-test") - they're baked into the workload-id:// URI
# the generated Certificate requests and the IAM role's trust policy condition.
#
# Apply after rolesanywhere-ca-issuer.yaml and the Kyverno policies (open `make tunnel-k8s`
# in another shell first):
#
#   export ROLESANYWHERE_TRUST_ANCHOR_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_trust_anchor_arn)
#   export ROLESANYWHERE_PROFILE_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_profile_arn)
#   export ROLESANYWHERE_ROLE_ARN=$(terraform -chdir=terraform output -raw rolesanywhere_role_arn)
#   export TEST_BUCKET_NAME=$(terraform -chdir=terraform output -raw rolesanywhere_test_bucket_name)
#   export AWS_REGION=$(terraform -chdir=terraform output -raw aws_region)
#   envsubst '${ROLESANYWHERE_TRUST_ANCHOR_ARN} ${ROLESANYWHERE_PROFILE_ARN} ${ROLESANYWHERE_ROLE_ARN} ${TEST_BUCKET_NAME} ${AWS_REGION}' \
#     < manifests/rolesanywhere-test.yaml | kubectl --kubeconfig kubeconfig apply -f -

apiVersion: v1
kind: Namespace
metadata:
  name: rolesanywhere-test

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rolesanywhere-test
  namespace: rolesanywhere-test
  annotations:
    # Triggers manifests/kyverno-rolesanywhere-policies.yaml's GeneratingPolicy to create
    # a matching Certificate automatically (workload-id://.../ns/rolesanywhere-test/sa/rolesanywhere-test,
    # SPIFFE-shaped but under a custom scheme - see docs/rolesanywhere.md for why not
    # literal spiffe://). Reuses this repo's existing custom annotation prefix from the
    # IRSA pod-identity-webhook (docs/irsa.md) rather than inventing a new one.
    rke2-lab.internal/rolesanywhere-enabled: "true"

---
apiVersion: v1
kind: Pod
metadata:
  name: rolesanywhere-test
  namespace: rolesanywhere-test
spec:
  serviceAccountName: rolesanywhere-test
  initContainers:
    # No official image ships aws_signing_helper, so it's fetched at pod start, same
    # pragmatic vendoring-at-apply-time this repo already does elsewhere (e.g. the
    # pod-identity-webhook manifest adapted from upstream's raw deploy/*.yaml). Pinned to a
    # specific release - check https://github.com/aws/rolesanywhere-credential-helper/releases
    # for newer ones.
    - name: fetch-signing-helper
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - |
          set -eu
          curl -fsSL https://rolesanywhere.amazonaws.com/releases/1.8.5/X86_64/Linux/Amzn2023/aws_signing_helper \
            -o /opt/bin/aws_signing_helper
          chmod +x /opt/bin/aws_signing_helper

          mkdir -p /opt/aws
          cat > /opt/aws/config <<EOF
          [default]
          credential_process = /opt/bin/aws_signing_helper credential-process --certificate /rolesanywhere/tls.crt --private-key /rolesanywhere/tls.key --trust-anchor-arn ${ROLESANYWHERE_TRUST_ANCHOR_ARN} --profile-arn ${ROLESANYWHERE_PROFILE_ARN} --role-arn ${ROLESANYWHERE_ROLE_ARN} --region ${AWS_REGION}
          region = ${AWS_REGION}
          EOF
      volumeMounts:
        - name: signing-helper
          mountPath: /opt/bin
        - name: aws-config
          mountPath: /opt/aws
  containers:
    - name: aws-cli
      image: public.ecr.aws/aws-cli/aws-cli:latest
      command: ["sleep", "infinity"]
      env:
        - name: AWS_CONFIG_FILE
          value: /opt/aws/config
        - name: AWS_REGION
          value: ${AWS_REGION}
        - name: TEST_BUCKET_NAME
          value: ${TEST_BUCKET_NAME}
      volumeMounts:
        - name: signing-helper
          mountPath: /opt/bin
          readOnly: true
        - name: aws-config
          mountPath: /opt/aws
          readOnly: true
        - name: rolesanywhere-tls
          mountPath: /rolesanywhere
          readOnly: true
  volumes:
    - name: signing-helper
      emptyDir: {}
    - name: aws-config
      emptyDir: {}
    - name: rolesanywhere-tls
      secret:
        secretName: rolesanywhere-test-tls
